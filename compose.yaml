name: naobot

services:
  lagrange-milky:
    image: ghcr.io/lagrangedev/lagrange.milky@sha256:a5ce89b34f95c2944fe049c91fcf42705270859e0b0f76dcd34f0b50d10c88e6
    container_name: lagrange-milky
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    environment:
      Lagrange__Login__Uin: "${QQ_UIN:?Set QQ_UIN in .env}"
      Lagrange__Login__AutoReLogin: "true"
      Lagrange__Protocol__Signer__Token: "${LAGRANGE_SIGNER_TOKEN:?Set LAGRANGE_SIGNER_TOKEN in .env}"
      Milky__AccessToken: "${MILKY_ACCESS_TOKEN:?Set MILKY_ACCESS_TOKEN in .env}"
      Milky__HttpServer__Host: "*"
      Milky__HttpServer__Port: "3000"
      Milky__Api__Http__Enabled: "true"
      Milky__Event__WebSocket__Enabled: "true"
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./lagrange-data:/root
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nao-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: nao-bot:1.4.0
    container_name: nao-bot
    restart: unless-stopped
    init: true
    depends_on:
      lagrange-milky:
        condition: service_started
    environment:
      DRIVER: "~httpx+~websockets"
      COMMAND_START: '[""]'
      LOG_LEVEL: "INFO"
      NAO_TEST_GROUP_ID: "${NAO_TEST_GROUP_ID:?Set NAO_TEST_GROUP_ID in .env}"
      NAO_ADMIN_QQ_IDS: "${NAO_ADMIN_QQ_IDS:-}"
      NAO_KEYWORDS_FILE: "/data/keywords.json"
      NAO_MODERATION_FILE: "/data/moderation.json"
      NAO_FRAUD_KEYWORDS_FILE: "/data/fraud_keywords.json"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      XDG_DATA_HOME: "/data/local/share"
      XDG_CACHE_HOME: "/data/cache"
      XDG_CONFIG_HOME: "/data/config"
      MEME_HOME: "/data/meme_generator"
      MEMES_COMMAND_PREFIXES: '[""]'
      MEMES_USE_SENDER_WHEN_NO_IMAGE: "true"
      MEMES_USE_DEFAULT_WHEN_NO_TEXT: "true"
      MEMES_CHECK_RESOURCES_ON_STARTUP: "true"
      ALEMBIC_STARTUP_CHECK: "false"
      EMOJIMIX_EXPLICIT: "true"
      EMOJIMIX_AUTO: "false"
      EMOJIMIX_CD: "5"
      MILKY_CLIENTS: >-
        [{"host":"lagrange-milky","port":3000,"access_token":"${MILKY_ACCESS_TOKEN}","secure":false}]
    volumes:
      - ./data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 640m
    cpus: 1.0
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
